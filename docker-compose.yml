# Postgres dev (Docker). Produksi memakai Neon dengan major yang SAMA (18).
# Image: postgres:18.6 (pin major.minor, bukan latest).
# Sumber versi Neon: https://neon.com/docs/postgresql/postgres-version-support
# (mendukung 14-18; default proyek baru = 18) + changelog 2026-06-05.
# Kredensial HANYA dari environment (.env lokal, tidak di-commit).
# Port hanya di loopback, tidak pernah 0.0.0.0.
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER belum diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB belum diisi}
    ports:
      - "127.0.0.1:${PGPORT:-5435}:5432"
    volumes:
      # Mount induk /var/lib/postgresql (BUKAN .../data): sejak image 18,
      # PGDATA pindah ke /var/lib/postgresql/18/docker dan VOLUME image
      # adalah /var/lib/postgresql. Sumber: docker-library/docs postgres
      # (bagian PGDATA, PR #1259). Baris di bawah sudah benar, jangan ubah.
      - pengingat-pgdata:/var/lib/postgresql
      - ./scripts/docker-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pengingat-pgdata:
